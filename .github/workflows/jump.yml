name: Jump replay
on:
  push:
    branches: ['jump-replay-*']
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - run: julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=benchmark benchmark/logitnash.jl | tee jump.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jump-replay
          path: jump.log
