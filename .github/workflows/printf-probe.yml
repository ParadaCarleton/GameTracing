name: Printf probe
on:
  push:
    branches: [printf-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - run: julia -e 'using Pkg; println(VERSION, " ", Pkg.Types.is_stdlib(Base.UUID("de0858da-6303-5e67-8744-51eddd5e25e8")), " ", get(Pkg.Types.stdlibs(), Base.UUID("de0858da-6303-5e67-8744-51eddd5e25e8"), nothing))'
      - run: julia --project=probe/printf_only -e 'using Pkg; Pkg.instantiate(); using Printf; @printf("printf only ok\n")'
        continue-on-error: true
      - run: julia --project=benchmark -e 'using Pkg; Pkg.instantiate(); println("benchmark env ok")'
        continue-on-error: true
      - run: julia --project=benchmark -e 'using Pkg; Pkg.resolve(); Pkg.instantiate(); println("benchmark env ok after resolve")'
        continue-on-error: true
