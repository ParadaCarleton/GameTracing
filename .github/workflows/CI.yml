name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
# A branch's push run and its pull-request run share a group, so only the newest one runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    # A dependency that does not yet load on prerelease Julia must not block a merge.
    continue-on-error: ${{ matrix.version == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1', 'pre']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: jdx/mise-action@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1'
      - name: Every line of src/ runs in the tests
        if: matrix.version == '1'
        run: |
          awk '/^SF:/{file=$0} /^DA:[0-9]+,0$/{print file, $0; bad=1} END{exit bad}' lcov.info
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: fatou lint --color never src test
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        file: [bordered.jl, branch.jl, callbacks.jl, failure.jl, geometry.jl, trace.jl, projection.jl]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: jdx/mise-action@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Install Gremlins
        run: julia --project=@gremlins -e 'using Pkg; Pkg.add(url="https://github.com/ParadaCarleton/Gremlins.jl", rev="main")'
      # Survivors at 0fc39ed: four `size(_, 1)` → `size(_, 2)` on square matrices (bordered.jl) and five
      # default-value tweaks (trace.jl); every other mutant is killed, so the bar sits just under.
      - name: Mutation testing
        run: |
          gremlins=$(julia --project=@gremlins -e 'using Gremlins; print(pkgdir(Gremlins))')
          julia --project=@gremlins "$gremlins/bin/gremlins-cli.jl" \
            --pkg "$GITHUB_WORKSPACE" --warm --files ${{ matrix.file }} --strong 0.95 --acceptable 0.90 \
            --json mutation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-${{ matrix.file }}
          path: mutation-report.json
          if-no-files-found: ignore
