name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1', 'pre']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: jdx/mise-action@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1'
      - name: Every line of src/ runs in the tests
        if: matrix.version == '1'
        run: |
          awk '/^SF:/{file=$0} /^DA:[0-9]+,0$/{print file, $0; bad=1} END{exit bad}' lcov.info
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: fatou lint --color never src test
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        file: [bordered.jl, branch.jl, callbacks.jl, failure.jl, trace.jl]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: jdx/mise-action@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Install Gremlins
        run: julia --project=@gremlins -e 'using Pkg; Pkg.add("Gremlins")'
      - name: Mutation testing
        run: |
          gremlins=$(julia --project=@gremlins -e 'using Gremlins; print(pkgdir(Gremlins))')
          julia --project=@gremlins "$gremlins/bin/gremlins-cli.jl" \
            --pkg "$GITHUB_WORKSPACE" --warm --files ${{ matrix.file }} --strong 0.80 --acceptable 0.60 \
            --json mutation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-${{ matrix.file }}
          path: mutation-report.json
          if-no-files-found: ignore
