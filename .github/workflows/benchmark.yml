name: Arm benchmark
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'test/arms.jl', 'test/games.jl', 'test/fixtures.jl', 'benchmark/**', '.github/workflows/benchmark.yml']
jobs:
  arms:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - run: julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=benchmark benchmark/arms.jl arms.csv | tee arms.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-benchmark
          path: |
            arms.csv
            arms.log
