name: Arm benchmark
on:
  workflow_dispatch:
  # Dispatch needs the workflow on main; until then a push to the arms branch runs it.
  push:
    branches: [trace-arms]
    paths: ['src/**', 'test/arms.jl', 'test/games.jl', 'test/fixtures.jl', 'benchmark/**', '.github/workflows/benchmark.yml']
  pull_request:
    paths: ['src/**', 'test/arms.jl', 'test/games.jl', 'test/fixtures.jl', 'benchmark/**', '.github/workflows/benchmark.yml']
jobs:
  arms:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          # Julia 1.13.3 does not count Printf as a stdlib, and General does not register it (printf-probe run 40445444890).
          version: '1.12'
      - uses: julia-actions/cache@v2
      - run: julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=benchmark benchmark/arms.jl arms.csv | tee arms.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-benchmark
          path: |
            arms.csv
            arms.log
