name: LogitNash benchmark
# Times GameTracing against LogitNash on one runner. A shared runner's absolute times drift; compare the solvers' ratios.
on:
  workflow_dispatch:
# An explicit bash runs with -eo pipefail, so a failed benchmark fails its step through `tee`.
defaults:
  run:
    shell: bash
jobs:
  logitnash:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JULIA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"
      - uses: julia-actions/cache@v2
      - run: julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=benchmark benchmark/logitnash_speed.jl logitnash_speed.csv 1 | tee logitnash_speed.txt
      - run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat logitnash_speed.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logitnash-speed
          path: logitnash_speed.*
